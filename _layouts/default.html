<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO -->
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- Open Graph / Facebook -->
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:type" content="website">
  <meta property="og:image" content="{{ site.url }}/assets/images/preview.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | default: site.title }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">
  <meta name="twitter:image" content="{{ site.url }}/assets/images/preview.png">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- Darkmode CSS -->
  <style>
    body, html {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: sans-serif;
    }
    a { color: #58a6ff; }
    a:hover { color: #1f6feb; }
    h1,h2,h3,h4,h5,h6 { color: #c9d1d9; }
    table { border-color: #30363d; color: #c9d1d9; }
    code, pre { background-color: #161b22; color: #c9d1d9; }
  </style>
</head>
<body>
  <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
    <!-- Page content -->
    {{ content }}
  </div>
</body>
</html>
